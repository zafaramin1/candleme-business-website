        /*
         * Falling asleep, and waking up.
         *
         * These are ANIMATIONS, not transitions, and that is the whole point.
         * The rule here used to be a plain transition, and on the three
         * engraved marks it never once ran: DraggableLogo sets its own inline
         * transition on the same property (and a flat brand logo gets none
         * at all), and an inline style beats a stylesheet rule. Measured on
         * the live page - the chrome faded over nearly two seconds while the
         * logo blinked out in a fifth of one, which is exactly "it
         * disappears in an instant and looks like a mistake". An animation
         * sits above inline styles in the cascade, so nothing can cancel it.
         *
         * Only opacity is animated. Not transform - the engraved mark
         * carries an inline translate(-50%,-50%) that an animation would
         * override, throwing it into the corner - and not mask or filter,
         * which isolate the blend group and flatten the engraving into a
         * sticker.
         *
         * ease-in and ease-out are exact time-reverses of each other
         * (cubic-bezier(.42,0,1,1) and cubic-bezier(0,0,.58,1) - each one's
         * control points are the other's, reflected through the curve's
         * centre). Fading out on ease-in and back in on ease-out, at the
         * same duration, is what makes the two directions genuinely
         * symmetric rather than merely both "slow": a hand-rolled
         * three-point keyframe for the fade-out (hold, then a steeper back
         * half) paired with a shorter, plain-eased fade-in reads as
         * asymmetric - the out holds its shape until far too late and then
         * falls fast, while the in finishes quicker - closer to a blink
         * than a settle. A single mirrored pair fixes both at once.
         *
         * Which layer leads is deliberately swapped between the two
         * directions: going to sleep, the controls dim first and the marks
         * follow a beat later, so the candle's own face is the last thing to
         * go; waking, the marks return first and the controls catch up,
         * so the candle is what greets the eye before anything is
         * clickable again.
         */
        /*
         * The centre logo carries [data-candle-chrome] on the same element as
         * its logo<->QR shutter, which is also an animation. While the shutter
         * is closing or opening it owns the property; otherwise a tap that
         * wakes the page would swallow the swap it asked for.
         */
        @keyframes candle-chrome-rest {
          from { opacity: 1; }
          to   { opacity: 0; }
        }
        @keyframes candle-chrome-wake {
          from { opacity: 0; }
          to   { opacity: 1; }
        }

        [data-cm-variant="ignite"][data-candle-resting="true"] [data-candle-chrome]:not([data-phase="closing"]):not([data-phase="opening"]),
        [data-cm-variant="ignite"][data-candle-resting="true"] button:not([data-candle-body-touch]):not([data-candle-resting-exempt]),
        [data-cm-variant="ignite"][data-candle-resting="true"] a {
          animation: candle-chrome-rest 1500ms ease-in forwards;
          /* Invisible controls must not be pressable: while the page is
             resting a tap should wake it, never fire the button nobody can
             see. The wake listener is on window, so the tap still lands.
             !important because the candle's own buttons carry an inline
             pointer-events: auto - without it this rule silently did nothing,
             which is how it was first written and measured. The candle body
             target is excluded from the selector, so the candle itself stays
             tappable while asleep.

             [data-candle-resting-exempt] is the same idea for a dialog that
             opens on its OWN timer rather than a user gesture (SaveToWalletPrompt).
             The [role="dialog"] guard in the rest timeout below only stops the
             page from FALLING asleep while a dialog is already open; it does
             nothing once resting is already true and a dialog mounts afterwards
             - nothing here watches for that mount, so the dialog's buttons would
             render already mid-fade and, worse, unclickable under
             pointer-events: none. Reported live: the wallet prompt appeared at
             ~10s with no usable buttons because the page had already gone
             resting at 5s. Exempting the buttons themselves sidesteps the race
             instead of trying to win it. */
          pointer-events: none !important;
        }
        [data-cm-variant="ignite"][data-candle-resting="true"] [data-candle-chrome]:not([data-phase="closing"]):not([data-phase="opening"]) {
          animation-delay: 450ms;
        }

        [data-cm-variant="ignite"][data-candle-resting="waking"] [data-candle-chrome]:not([data-phase="closing"]):not([data-phase="opening"]),
        [data-cm-variant="ignite"][data-candle-resting="waking"] button:not([data-candle-body-touch]):not([data-candle-resting-exempt]),
        [data-cm-variant="ignite"][data-candle-resting="waking"] a {
          /* backwards, never both. The page sits in "waking" until the
             next rest, so a forwards fill would pin opacity at 1 for minutes
             and take the property away from the component that owns it - the
             logo dims itself during the QR sequence and on exit. Backwards

          from { --candle-chrome-fade: 0; }

        }

        }
        [data-cm-variant="ignite"][data-candle-resting="waking"] [data-candle-engraving]:not([data-phase="closing"]):not([data-phase="opening"]) {
